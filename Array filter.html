<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Array</title>
</head>

<body>

    <script>

        var arr = [10, 20, 30, 40, 50, 60];

        var Filter = arr.filter(function (item) {
            return item > 40;
        });

        document.write(Filter);

    </script>

</body>

</html>
