<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array Find</title>
</head>

<body>

    <script>

        var arr = [10, 20, 30, 40, 50, 60];

        var arr2 = arr.find(function (item) {
            return item > 30;
        });

        document.write(arr2);

    </script>

</body>

</html>
