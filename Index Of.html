<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array IndexOf</title>
</head>

<body>

    <script>

        var arr = ["Apple", "Banana", "Mango", "Orange"];

        var result = arr.indexOf("Mango");

        document.write(result);

    </script>

</body>

</html>
