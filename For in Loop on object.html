<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For in Loop on Object</title>
</head>

<body>

    <script>

        var Person = {
            name: "Jack",
            age: 39,
            city: "London",
            height: "6 Feet"
        };

        for (var item in Person) {
            document.write(Person[item] + "<br>");
        }

    </script>

</body>

</html>
