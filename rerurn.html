<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Return</title>
</head>

<body>

<script>

    function adder(num1, num2) {
        var sum = num1 + num2;
        return sum;
    }

    var result1 = adder(15, 10);
    document.write("The sum is: " + result1 + "<br>");

</script>

</body>

</html>
