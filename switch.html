<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch</title>
</head>

<body>

<script>

    var A = 2;

    switch (A) {
        case 1:
            document.write("A is 1");
            break;
        case 2:
            document.write("A is 2");
            break;
        case 3:
            document.write("A is 3");
            break;
        default:
            document.write("A is not 1, 2, or 3");
    }

</script>

</body>

</html>
