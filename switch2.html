<!DOCTYPE html>
<html>

<head>
    <title>Switch 2</title>
</head>

<body>

    <script>

        var Marks = 90;

        switch (true) {

            case (Marks <= 100 && Marks >= 80):
                document.write('A+');
                break;

            case (Marks < 80 && Marks >= 70):
                document.write('A');
                break;

            case (Marks < 70 && Marks >= 60):
                document.write('A-');
                break;

            case (Marks < 60 && Marks >= 50):
                document.write('B');
                break;

            case (Marks < 50 && Marks >= 40):
                document.write('C');
                break;

            case (Marks < 40 && Marks >= 33):
                document.write('D');
                break;

            case (Marks < 33 && Marks >= 0):
                document.write('F');
                break;

            default:
                document.write('Invalid Marks');
        }

    </script>

</body>

</html>
