<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Non Primitive Data Types</title>
</head>

<body>

<script>
    var A = {
        Name: "John",
        Age: 30,
        City: "New York"
    }

    document.write(A.Name);
    document.write("<br>");
    document.write(A.Age);
    document.write("<br>");
    document.write(A.City);
    document.write("<br>");



    var B = ["Apple ", "Banana ", "Cherry"];
    document.write(B);


</script>

</body> 

</html>
