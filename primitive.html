<!DOCTYPE html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primitive Data Types</title>
</head>

<body>

</body>

<script>
    var A = 10;
    document.write(A);
    document.write("<br>");

    var B = "Hello World";
    document.write(B);
    document.write("<br>");

    var C = true;
    document.write(C);
    document.write("<br>");

    var D = null;
    document.write(D);
    document.write("<br>");

    var E;
    document.write(E);
</script>
