<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variables</title>
</head>

<body>

<script>
    var a = 10;
    var b = 20;
    var c = a + b;

    document.write("The value of a is: " + a + "<br>");
    document.write("The value of b is: " + b + "<br>");
    document.write("The sum of a and b is: " + c);

</script>

</body>

</html>
