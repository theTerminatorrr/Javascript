<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array Loop</title>
</head>

<body>

    <script>

        var fruits = ["Apple", "Banana", "Mango", "Orange", "Pineapple", "Grapes", "Strawberry"];

        var i;
        for (i = 0; i < fruits.length; i++) {
            document.write("Fruit " + (i + 1) + ": " + fruits[i] + "<br>");
        }

    </script>

</body>

</html>
