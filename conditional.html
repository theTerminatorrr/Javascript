<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conditional</title>
</head>

<body>

</body>

<script>

    var A = 10;
    var B = 5;

    if (A > B) {
        document.write("A is greater than B");
    } else if (A < B) {
        document.write("A is less than B");
    } else {
        document.write("A is equal to B");
    }

</script>
