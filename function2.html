<script>

    function adder(num1, num2) {
        var sum = num1 + num2;
        document.write("The sum of " + num1 + " and " + num2 + " is: " + sum + "<br>");
    }

    adder(5, 10);
    adder(50, 100);
    adder(500, 1000);

</script>
